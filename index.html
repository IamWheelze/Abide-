<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abide — Stewarding Your Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: 'Lato', sans-serif; background-image: url('https://i.postimg.cc/bvGs6fsc/IMG-20260307-WA0028.jpg'); background-size: cover; background-position: center; background-attachment: fixed; }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:rgba(0,0,0,.15); border-radius:8px; }
  </style>
</head>

<div id="root">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;">
    <div style="width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;animation:spin 0.8s linear infinite;"></div>
    <div style="color:#fff;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,0.5);">Loading…</div>
  </div>
