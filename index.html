<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abide — Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: 'Lato', sans-serif; }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:rgba(0,0,0,.15); border-radius:8px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ── Forest Green theme ───────────────────────────────────────── */
const T = {
  accent: "#2C5F2E",
  card:   "rgba(44,95,46,0.07)",
  bg:     "#EDF2EC",
  text:   "#141F14",
  sub:    "#5A7A5B",
  border: "rgba(44,95,46,0.22)",
};

/* ── Config — edit these values ──────────────────────────────── */
const C = {
  orgName:       "Abide",
  tagline:       "Abide in me, and I in you.",
  taglineRef:    "John 15:4",
  welcomeTitle:  "Welcome",
  welcomeBody:   "We are honored to invite you into this intentional private space for senior executive Christian leaders. In a world that demands constant excellence and often causes you to compartmentalize your belief in God and your faith, Abide is a dedicated harbor for your soul, bridging the gap between professional leadership, spiritual depth, and true rest.",
  welcomeBody2:  "Please share a few details as you enter this space.",
  ctaLabel:      "Enter the Space",
  bgImageUrl:    "",

  /* Zoom meeting details */
  zoomJoinUrl:   "https://zoom.us/j/84699471218",
  zoomPasscode:  "905196",

  /* Event date/time */
  eventTitle:    "Abide",
  eventDate:     "2026-03-28",  /* YYYY-MM-DD */
  eventTime:     "18:00",       /* 6pm WAT    */
  eventDuration: 1,             /* hours      */

  /* Formspree — sign up free at formspree.io, paste your form ID here */
  formspreeId:   "",
};

const INTENTS = [
  "A desire for true rest and spiritual renewal.",
  "A need for clarity and discernment in leadership.",
  "A heart for connection and fellowship with like-minded Christian leaders.",
  "A dedicated time for prayer and reflection.",
];

/* ── Atoms ────────────────────────────────────────────────────── */
const Label = ({ children }) => (
  <div style={{ fontSize:10, letterSpacing:"0.18em", textTransform:"uppercase", fontWeight:700, color:T.sub, marginBottom:6 }}>{children}</div>
);

function FormInput({ style, ...props }) {
  const [focus, setFocus] = useState(false);
  return (
    <input onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)}
      style={{ width:"100%", padding:"11px 14px", background:"transparent", border:`1px solid ${focus?T.accent:T.border}`, borderRadius:6, color:T.text, fontFamily:"'Lato',sans-serif", fontSize:14, outline:"none", transition:"border-color .2s", ...style }}
      {...props} />
  );
}

/* ── Calendar helpers ─────────────────────────────────────────── */
function calData() {
  if (!C.eventDate || !C.eventTime) return null;
  const [y,mo,d] = C.eventDate.split("-").map(Number);
  const [h,mi]   = C.eventTime.split(":").map(Number);
  const start    = new Date(y, mo-1, d, h, mi);
  const end      = new Date(start.getTime() + (parseFloat(C.eventDuration)||1)*3600000);
  const pad      = n => String(n).padStart(2,"0");
  const fmt      = x => `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const iso      = x => `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}:00`;
  return { start, end, fmt, iso };
}

function zoomDetails() {
  const parts = [C.zoomJoinUrl];
  if (C.zoomPasscode) parts.push(`Passcode: ${C.zoomPasscode}`);
  return parts.join("\n");
}

function gCalUrl() {
  const d = calData();
  const params = { action:"TEMPLATE", text:C.eventTitle||C.orgName };
  if (d) params.dates = `${d.fmt(d.start)}/${d.fmt(d.end)}`;
  if (C.zoomJoinUrl) { params.location = C.zoomJoinUrl; params.details = zoomDetails(); }
  return `https://calendar.google.com/calendar/render?${new URLSearchParams(params)}`;
}

function outlookUrl() {
  const d = calData();
  const params = { subject:C.eventTitle||C.orgName };
  if (d) { params.startdt = d.iso(d.start); params.enddt = d.iso(d.end); }
  if (C.zoomJoinUrl) { params.location = C.zoomJoinUrl; params.body = zoomDetails(); }
  return `https://outlook.live.com/calendar/0/deeplink/compose?${new URLSearchParams(params)}`;
}

function downloadIcal() {
  const d = calData(); if (!d) return;
  const title = C.eventTitle || C.orgName;
  const lines = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Abide//EN",
    "BEGIN:VTIMEZONE","TZID:Africa/Lagos",
    "BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:+0100","TZOFFSETTO:+0100","TZNAME:WAT","END:STANDARD",
    "END:VTIMEZONE",
    "BEGIN:VEVENT",
    `UID:abide-${Date.now()}@abide`,
    `DTSTART;TZID=Africa/Lagos:${d.fmt(d.start)}`,
    `DTEND;TZID=Africa/Lagos:${d.fmt(d.end)}`,
    `SUMMARY:${title}`,
  ];
  if (C.zoomJoinUrl) lines.push(`LOCATION:${C.zoomJoinUrl}`);
  if (C.zoomJoinUrl) lines.push(`DESCRIPTION:${zoomDetails().replace(/\n/g,"\\n")}`);
  lines.push(
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY",`DESCRIPTION:Tomorrow: ${title} at 6pm WAT`,"END:VALARM",
    "BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY",`DESCRIPTION:${title} starts in 1 hour`,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  );
  const a = Object.assign(document.createElement("a"), {
    href: URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/calendar"})),
    download: `${title.replace(/\s+/g,"-")}.ics`,
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ── App ──────────────────────────────────────────────────────── */
function App() {
  const isMobile = window.innerWidth < 768;
  const [form, setForm]     = useState({ name:"", email:"", phone:"", city:"", org:"", intents:[], consent:false });
  const [status, setStatus] = useState("idle");
  const [errMsg, setErrMsg] = useState("");
  const [anim, setAnim]     = useState(false);

  useEffect(()=>{ const t=setTimeout(()=>setAnim(true),80); return ()=>clearTimeout(t); },[]);
  useEffect(()=>{ if (status==="success" && calData()) downloadIcal(); },[status]);

  const toggle = item => setForm(f=>({
    ...f, intents: f.intents.includes(item) ? f.intents.filter(i=>i!==item) : [...f.intents,item]
  }));

  const submit = () => {
    if (!form.name || !form.email) { setErrMsg("Please enter your name and email to continue."); return; }
    setErrMsg("");
    setStatus("success");
    if (C.formspreeId) {
      fetch(`https://formspree.io/f/${C.formspreeId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          name:    form.name,
          email:   form.email,
          phone:   form.phone,
          city:    form.city,
          org:     form.org,
          intents: form.intents.join("; "),
          consent: form.consent ? "Yes" : "No",
        }),
      }).catch(()=>{});
    }
  };

  const SectionHead = ({ num, title }) => (
    <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:22, marginTop:8 }}>
      <div style={{ width:28, height:28, borderRadius:"50%", border:`1px solid ${T.accent}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, color:T.accent, flexShrink:0 }}>{num}</div>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:18, fontWeight:500, color:T.text, letterSpacing:"0.04em" }}>{title}</div>
      <div style={{ flex:1, height:1, background:T.border }}/>
    </div>
  );

  const Checkbox = ({ checked, onClick, label }) => (
    <div onClick={onClick} style={{ display:"flex", alignItems:"flex-start", gap:12, cursor:"pointer", padding:"14px 16px", borderRadius:8, background:checked?`${T.accent}18`:"transparent", border:`1px solid ${checked?T.accent:T.border}`, transition:"all .18s" }}>
      <div style={{ width:18, height:18, borderRadius:4, border:`1.5px solid ${checked?T.accent:T.sub}`, background:checked?T.accent:"transparent", flexShrink:0, marginTop:1, display:"flex", alignItems:"center", justifyContent:"center", transition:"all .18s" }}>
        {checked && <svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 4L3.5 6.5L9 1" stroke="#FAF7F2" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      </div>
      <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:16, color:T.text, lineHeight:1.5 }}>{label}</span>
    </div>
  );

  const CalBtn = ({ href, onClick, children }) => {
    const [hov, setHov] = useState(false);
    const s = { display:"inline-flex", alignItems:"center", gap:8, padding:"11px 18px", borderRadius:8, border:`1px solid ${T.border}`, background:hov?`${T.accent}20`:`${T.accent}0D`, color:T.text, fontSize:13, fontFamily:"'Lato',sans-serif", textDecoration:"none", cursor:"pointer", transition:"background .18s" };
    return href
      ? <a href={href} target="_blank" rel="noopener noreferrer" style={s} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>{children}</a>
      : <button style={s} onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>{children}</button>;
  };

  const CalSvg = ({ d }) => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="4" width="18" height="17" rx="2" stroke={T.accent} strokeWidth="1.8"/>
      <path d="M3 9h18" stroke={T.accent} strokeWidth="1.8"/>
      <path d="M8 2v4M16 2v4" stroke={T.accent} strokeWidth="1.8" strokeLinecap="round"/>
      {d && <path d={d} stroke={T.accent} strokeWidth="1.5" strokeLinecap="round"/>}
    </svg>
  );

  const pad = isMobile ? "0 24px 60px" : "0 40px 80px";

  return (
    <div style={{ minHeight:"100%", background:T.bg, display:"flex", flexDirection:"column", alignItems:"center", overflowY:"auto" }}>

      {/* Banner image */}
      {C.bgImageUrl && (
        <div style={{ width:"100%", maxHeight: isMobile ? 220 : 320, overflow:"hidden", flexShrink:0 }}>
          <img src={C.bgImageUrl} alt="Abide" style={{ width:"100%", height:"100%", objectFit:"cover", objectPosition:"center", display:"block" }} />
        </div>
      )}

      {/* Header */}
      <div style={{ width:"100%", maxWidth:640, padding:isMobile?"40px 24px 0":"64px 40px 0", opacity:anim?1:0, transform:anim?"translateY(0)":"translateY(18px)", transition:"opacity .7s ease, transform .7s ease" }}>
        <div style={{ textAlign:"center", marginBottom:6 }}>
          <img src="https://i.imgur.com/leaznz6.jpeg" alt={C.orgName} style={{ maxWidth: isMobile ? 320 : 460, width:"100%", display:"inline-block" }} />
        </div>
        <div style={{ textAlign:"center", marginBottom:48 }}>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:15, fontStyle:"italic", color:T.sub }}>{C.tagline}</div>
          {C.taglineRef && <div style={{ fontSize:11, letterSpacing:"0.2em", textTransform:"uppercase", color:T.accent, marginTop:4 }}>{C.taglineRef}</div>}
        </div>
        <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:12, padding:isMobile?"28px 24px":"40px 48px", marginBottom:32, backdropFilter:"blur(8px)" }}>
          <div style={{ fontSize:11, letterSpacing:"0.22em", textTransform:"uppercase", color:T.accent, marginBottom:12 }}>{C.welcomeTitle}</div>
          <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:17, lineHeight:1.85, color:T.text, margin:"0 0 16px" }}>{C.welcomeBody}</p>
          {C.welcomeBody2 && <p style={{ fontSize:13, lineHeight:1.7, color:T.sub, margin:0 }}>{C.welcomeBody2}</p>}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:36 }}>
          <div style={{ flex:1, height:1, background:T.border }}/>
          <div style={{ fontSize:10, letterSpacing:"0.25em", textTransform:"uppercase", color:T.sub }}>The Registration Form</div>
          <div style={{ flex:1, height:1, background:T.border }}/>
        </div>
      </div>

      {/* Form */}
      {status !== "success" ? (
        <div style={{ width:"100%", maxWidth:640, padding:pad, opacity:anim?1:0, transform:anim?"translateY(0)":"translateY(24px)", transition:"opacity .9s ease .15s, transform .9s ease .15s" }}>

          <SectionHead num="1" title="Personal Connection"/>
          <div style={{ marginBottom:16 }}><Label>Full Name</Label><FormInput placeholder="Enter your full name" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
          <div style={{ marginBottom:16 }}><Label>Email Address</Label><FormInput type="email" placeholder="Enter your email address" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/></div>
          <div style={{ marginBottom:36 }}>
            <Label>Phone Number <span style={{ fontWeight:300, opacity:.6 }}>— Optional</span></Label>
            <FormInput type="tel" placeholder="For a brief text reminder before we begin" value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))}/>
          </div>

          <SectionHead num="2" title="Your Context"/>
          <div style={{ marginBottom:16 }}>
            <Label>City &amp; Country</Label>
            <FormInput placeholder="e.g. Lagos, Nigeria" value={form.city} onChange={e=>setForm(f=>({...f,city:e.target.value}))}/>
            <div style={{ fontSize:11, color:T.sub, marginTop:5 }}>To help us honor your time zone and global perspective.</div>
          </div>
          <div style={{ marginBottom:36 }}>
            <Label>Organization &amp; Job Title</Label>
            <FormInput placeholder="e.g. CEO, Meridian Group" value={form.org} onChange={e=>setForm(f=>({...f,org:e.target.value}))}/>
            <div style={{ fontSize:11, color:T.sub, marginTop:5 }}>So we can know the weight of the leadership you carry.</div>
          </div>

          <SectionHead num="3" title="Your Intent"/>
          <div style={{ marginBottom:36 }}>
            <Label>What are you seeking for your soul in this season? <span style={{ fontWeight:300 }}>Select all that apply.</span></Label>
            <div style={{ display:"flex", flexDirection:"column", gap:10, marginTop:10 }}>
              {INTENTS.map((item,i)=><Checkbox key={i} checked={form.intents.includes(item)} onClick={()=>toggle(item)} label={item}/>)}
            </div>
          </div>

          <SectionHead num="4" title="Consent"/>
          <div style={{ marginBottom:40 }}>
            <Checkbox checked={form.consent} onClick={()=>setForm(f=>({...f,consent:!f.consent}))} label="I would like to receive future communication and updates from the Abide team."/>
          </div>

          {errMsg && (
            <div style={{ background:`${T.accent}15`, border:`1px solid ${T.accent}50`, borderRadius:8, padding:"12px 16px", marginBottom:20, fontSize:13, color:T.text }}>{errMsg}</div>
          )}

          <button onClick={submit}
            style={{ width:"100%", padding:"18px 32px", background:T.accent, border:"none", borderRadius:8, cursor:"pointer", fontFamily:"'Cormorant Garamond',serif", fontSize:18, fontWeight:600, letterSpacing:"0.08em", color:"#FAF7F2", display:"flex", alignItems:"center", justifyContent:"center", gap:10, transition:"opacity .2s, transform .15s" }}
            onMouseEnter={e=>{ e.currentTarget.style.opacity=".85";e.currentTarget.style.transform="translateY(-1px)"; }}
            onMouseLeave={e=>{ e.currentTarget.style.opacity="1";e.currentTarget.style.transform="translateY(0)"; }}>
            {C.ctaLabel}
          </button>

          <div style={{ textAlign:"center", marginTop:14 }}>
            <span style={{ fontSize:11, color:T.sub }}>Your information is kept private and treated with the utmost care.</span>
          </div>
        </div>

      ) : (
        /* Success */
        <div style={{ width:"100%", maxWidth:640, padding:pad, textAlign:"center", animation:"fadeUp .6s ease both" }}>
          <div style={{ width:56, height:56, borderRadius:"50%", border:`1.5px solid ${T.accent}`, display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 28px" }}>
            <svg width="24" height="20" viewBox="0 0 24 20"><path d="M2 10L9 17L22 3" stroke={T.accent} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>

          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:34, fontWeight:300, color:T.text, marginBottom:12, letterSpacing:"0.04em" }}>Welcome in.</div>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:17, fontStyle:"italic", color:T.sub, lineHeight:1.8, marginBottom:8 }}>
            "Come to me, all you who are weary and burdened,<br/>and I will give you rest."
          </div>
          <div style={{ fontSize:11, letterSpacing:"0.2em", color:T.accent, marginBottom:32 }}>Matthew 11:28</div>

          <div style={{ background:`${T.accent}0D`, border:`1px solid ${T.accent}30`, borderRadius:12, padding:"24px 28px", marginBottom:24 }}>
            <div style={{ fontSize:11, letterSpacing:"0.18em", textTransform:"uppercase", color:T.accent, marginBottom:10 }}>You're registered</div>
            <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:16, color:T.text, lineHeight:1.8, margin:0 }}>
              We are grateful you've taken this step. The Zoom link has been added to your calendar — you'll find everything you need there when the time comes.
            </p>
          </div>

          {/* Add to Calendar */}
          <div style={{ marginTop:28 }}>
            <div style={{ fontSize:10, letterSpacing:"0.22em", textTransform:"uppercase", color:T.sub, marginBottom:14 }}>Add to your calendar</div>
            <div style={{ display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap" }}>
              <CalBtn href={gCalUrl()}><CalSvg d="M8 15h8"/> Google Calendar</CalBtn>
              <CalBtn href={outlookUrl()}><CalSvg d="M8 14h8M8 17h5"/> Outlook</CalBtn>
              <CalBtn onClick={downloadIcal}><CalSvg d="M12 13v4M10 15h4"/> Apple Calendar</CalBtn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
